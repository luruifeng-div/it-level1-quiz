<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信息技术160题在线练习</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, 0.11);
      --blue: #0071e3;
      --green: #248a3d;
      --red: #d70015;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.10);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 42%, #eef3f8 100%);
    }

    .shell { max-width: 1040px; margin: 0 auto; padding: 28px 18px 40px; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      margin: 0 -18px 18px; padding: 12px 18px;
      backdrop-filter: blur(18px);
      background: rgba(245, 245, 247, 0.72);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-weight: 700; font-size: 18px; }
    .meta { color: var(--muted); font-size: 13px; }

    .hero { padding: 18px 0 12px; }
    h1 { margin: 0; font-size: 34px; line-height: 1.18; font-weight: 750; }
    .lead { margin: 8px 0 0; color: var(--muted); font-size: 16px; line-height: 1.65; }

    .panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 18px;
      backdrop-filter: blur(22px);
    }

    .setup { display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 12px; align-items: end; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    select, input {
      width: 100%; height: 42px; border-radius: var(--radius);
      border: 1px solid var(--line); background: rgba(255,255,255,0.9);
      color: var(--text); padding: 0 12px; font-size: 15px; outline: none;
    }
    select:focus, input:focus { border-color: rgba(0,113,227,0.55); box-shadow: 0 0 0 3px rgba(0,113,227,0.14); }
    button {
      height: 42px; border: 0; border-radius: var(--radius); padding: 0 16px;
      font-weight: 650; font-size: 15px; cursor: pointer;
      color: #fff; background: var(--blue);
      transition: transform .16s ease, filter .16s ease, background .16s ease;
    }
    button:hover { filter: brightness(0.96); }
    button:active { transform: scale(0.98); }
    button.secondary { background: #e8e8ed; color: var(--text); }
    button.danger { background: var(--red); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .quiz-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(0,0,0,.05); color: var(--muted); font-size: 13px;
    }
    .progress { height: 8px; background: #e8e8ed; border-radius: 999px; overflow: hidden; margin: 10px 0 16px; }
    .progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #0071e3, #64d2ff); transition: width .22s ease; }

    .question-title { font-size: 20px; line-height: 1.55; font-weight: 700; margin: 8px 0 16px; }
    .question-sub { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .option {
      display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
      width: 100%; padding: 13px 14px; margin: 10px 0;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: rgba(255,255,255,0.86); cursor: pointer;
    }
    .option:hover { border-color: rgba(0,113,227,.38); background: #fff; }
    .option input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--blue); }
    .option.selected { border-color: rgba(0,113,227,.65); box-shadow: 0 0 0 3px rgba(0,113,227,.11); }
    .option.correct { border-color: rgba(36,138,61,.58); background: #f0fbf3; }
    .option.wrong { border-color: rgba(215,0,21,.45); background: #fff2f3; }
    .opt-key { font-weight: 700; margin-right: 6px; }

    .actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
    .score-card { background: var(--surface-strong); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .score-card b { display: block; font-size: 24px; margin-top: 4px; }
    .analysis {
      margin-top: 16px; padding: 14px; border-radius: var(--radius);
      background: #f7f7fa; border: 1px solid var(--line); line-height: 1.7;
    }
    .analysis-title { font-weight: 700; margin-bottom: 6px; }
    .review-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .review-item:last-child { border-bottom: 0; }
    .hide { display: none !important; }

    @media (max-width: 760px) {
      .setup { grid-template-columns: 1fr; }
      h1 { font-size: 28px; }
      .quiz-head { align-items: flex-start; flex-direction: column; }
      .score-grid { grid-template-columns: 1fr 1fr; }
      .actions button { flex: 1 1 140px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">信息技术理论练习</div>
      <div class="meta">160 题 · 单选 / 多选 · 含解析</div>
    </div>
  </div>

  <main class="shell">
    <section class="hero">
      <h1>信息技术160题在线答题</h1>
      <p class="lead">选择练习方式与题量后开始作答，提交后自动评分，并逐题查看答案解析。</p>
    </section>

    <section id="setup" class="panel">
      <div class="setup">
        <div>
          <label for="mode">练习方式</label>
          <select id="mode">
            <option value="sequential">顺序练习</option>
            <option value="random">随机练习</option>
            <option value="wrong">只看错题</option>
          </select>
        </div>
        <div>
          <label for="count">题目数量</label>
          <input id="count" type="number" min="1" max="160" value="20" />
        </div>
        <div>
          <label for="jump">顺序起始题号</label>
          <input id="jump" type="number" min="1" max="160" value="1" />
        </div>
        <button id="start">开始答题</button>
      </div>
    </section>

    <section id="quiz" class="panel hide">
      <div class="quiz-head">
        <div>
          <span id="q-progress" class="pill"></span>
          <span id="q-type" class="pill"></span>
          <span id="q-knowledge" class="pill"></span>
        </div>
        <div class="pill" id="answered-count"></div>
      </div>
      <div class="progress"><span id="bar"></span></div>
      <div id="question"></div>
      <div class="actions">
        <button id="prev" class="secondary">上一题</button>
        <button id="next" class="secondary">下一题</button>
        <button id="submit" class="danger">提交试卷</button>
      </div>
    </section>

    <section id="result" class="panel hide">
      <h2>练习结果</h2>
      <div id="summary" class="score-grid"></div>
      <div class="actions">
        <button id="again">重新练习</button>
        <button id="review-wrong" class="secondary">查看错题解析</button>
        <button id="review-all" class="secondary">查看全部解析</button>
      </div>
      <div id="review"></div>
    </section>
  </main>

    const els = {

    const state = { paper: [], index: 0, answers: {}, startedAt: 0, wrongOnly: false };

    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];

      return arr;

    }

    function buildPaper() {
      const mode = els.mode.value;
      const count = Math.max(1, Math.min(Number(els.count.value) || 20, QUESTION_BANK.length));

      if (mode === 'random') return shuffle(QUESTION_BANK).slice(0, count);
      if (mode === 'wrong') {
        const ids = JSON.parse(localStorage.getItem('appleQuizWrongIds') || '[]');
        const wrongs = QUESTION_BANK.filter(q => ids.includes(q.id));

      return QUESTION_BANK.slice(start - 1, start - 1 + count);

          </label>`).join('')}</div>
      `;
      els.question.querySelectorAll('input').forEach(input => input.addEventListener('change', () => choose(input.value)));
    }

    function choose(key) {
      const q = state.paper[state.index];
      if (!state.answers[q.id]) state.answers[q.id] = new Set();
      if (isMultiple(q)) {
        state.answers[q.id].has(key) ? state.answers[q.id].delete(key) : state.answers[q.id].add(key);
        if (state.answers[q.id].size === 0) delete state.answers[q.id];
      } else {
        state.answers[q.id] = new Set([key]);
      }
      renderQuestion();
    }

    function score() {
      let correct = 0;
      const wrongIds = [];
      const rows = state.paper.map(q => {
        const mine = selectedAnswer(q);
        const ok = mine === q.answer;
        if (ok) correct++; else wrongIds.push(q.id);
        return { q, mine: mine || '未作答', ok };
      });
      const oldWrong = new Set(JSON.parse(localStorage.getItem('appleQuizWrongIds') || '[]'));
      wrongIds.forEach(id => oldWrong.add(id));
      rows.filter(r => r.ok).forEach(r => oldWrong.delete(r.q.id));
      localStorage.setItem('appleQuizWrongIds', JSON.stringify([...oldWrong]));
      return { correct, rows, total: state.paper.length, percent: Math.round(correct / state.paper.length * 100) };
    }

    function submitQuiz() {
      const res = score();
      els.quiz.classList.add('hide'); els.result.classList.remove('hide');
      els.summary.innerHTML = `
        <div class="score-card"><span>总题数</span><b>${res.total}</b></div>
        <div class="score-card"><span>答对</span><b>${res.correct}</b></div>
        <div class="score-card"><span>得分</span><b>${res.percent}</b></div>
        <div class="score-card"><span>用时</span><b>${durationText()}</b></div>`;
      renderReview(res.rows.filter(r => !r.ok));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderReview(rows) {
      if (!rows.length) {
        els.review.innerHTML = '<div class="analysis"><div class="analysis-title">全部正确</div>本轮没有错题，可以继续增加题量挑战。</div>';
        return;
      }
      els.review.innerHTML = rows.map(r => `
        <div class="review-item">
          <div class="question-sub"><span class="pill">题号 ${r.q.id}</span><span class="pill">${r.q.type}</span><span class="pill">${r.q.knowledge || '未分类'}</span></div>
          <div class="question-title">${r.q.question}</div>
          ${r.q.options.map(o => `<div class="option ${r.q.answer.includes(o.key) ? 'correct' : ''} ${r.mine.includes(o.key) && !r.q.answer.includes(o.key) ? 'wrong' : ''}"><span></span><span><span class="opt-key">${o.key}.</span>${o.text}</span></div>`).join('')}
          <div class="analysis"><div class="analysis-title">答案解析</div>你的答案：${r.mine}；正确答案：${r.q.answer}<br/>${r.q.explanation}</div>
        </div>`).join('');
    }

    els.mode.addEventListener('change', () => { els.jump.disabled = els.mode.value !== 'sequential'; });
    els.start.addEventListener('click', startQuiz);
    els.prev.addEventListener('click', () => { if (state.index > 0) { state.index--; renderQuestion(); } });
    els.next.addEventListener('click', () => { if (state.index < state.paper.length - 1) { state.index++; renderQuestion(); } });
    els.submit.addEventListener('click', submitQuiz);
    els.again.addEventListener('click', () => { els.result.classList.add('hide'); els.setup.classList.remove('hide'); window.scrollTo({top:0, behavior:'smooth'}); });
    els.reviewWrong.addEventListener('click', () => renderReview(score().rows.filter(r => !r.ok)));
    els.reviewAll.addEventListener('click', () => renderReview(score().rows));
    els.mode.dispatchEvent(new Event('change'));
  </script>
</body>
</html>
